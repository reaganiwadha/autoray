[project]
name = "service"
version = "0.1.0"
description = "FastAPI service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "sqlmodel>=0.0.31",
    "uvicorn[standard]",
    "email-validator",
    "psycopg2-binary",
    "minio",
    "python-multipart",
    "Pillow",
    "ffmpeg-python",
]

[project.scripts]
start = "service.main:run"
