version: "0.5"

processes:
  postgres:
    command: |
      mkdir -p "$PGHOST"
      if [ ! -d "$PGDATA" ]; then
        initdb -D "$PGDATA" --no-locale --encoding=UTF8 --username=postgres
        echo "host all all 127.0.0.1/32 trust" >> "$PGDATA/pg_hba.conf"
        echo "host all all ::1/128 trust" >> "$PGDATA/pg_hba.conf"
      fi
      postgres -D "$PGDATA" -k "$PGHOST" -p "$PGPORT"
    readiness_probe:
      exec:
        command: pg_isready -h "$PGHOST" -p "$PGPORT"
      initial_delay_seconds: 2
      period_seconds: 5
      timeout_seconds: 2
      success_threshold: 1
    availability:
      restart: always

  createdb:
    command: |
      createdb -h "$PGHOST" -p "$PGPORT" -U postgres autoray || true
    depends_on:
      postgres:
        condition: process_healthy

  migrations:
    command: |
      export GOOSE_DRIVER=postgres
      export GOOSE_DBSTRING=$DATABASE_URL
      export GOOSE_MIGRATION_DIR=./pg-migrations
      goose up
    depends_on:
      createdb:
        condition: process_completed_successfully

  minio:
    command: |
      mkdir -p .data/minio
      minio server .data/minio --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    readiness_probe:
      http_get:
        host: localhost
        port: 9000
        path: /minio/health/live
      initial_delay_seconds: 2
      period_seconds: 5
  
  create-bucket:
    command: |
      mc alias set local http://localhost:9000 minioadmin minioadmin
      mc mb local/medias || true
      mc anonymous set public local/medias
      mc mb local/thumbnails || true
      mc anonymous set public local/thumbnails
    depends_on:
      minio:
        condition: process_healthy

  service:
    command: |
      cd service
      uv run uvicorn service.main:app --reload --port 8000
    environment:
      - S3_ENDPOINT=localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=medias
      - S3_SECURE=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    readiness_probe:
      http_get:
        host: localhost
        port: 8000
        path: /status
      initial_delay_seconds: 2
      period_seconds: 5
    depends_on:
      migrations:
        condition: process_completed_successfully
      create-bucket:
        condition: process_completed_successfully

  client:
    command: |
      cd client
      yarn dev
    depends_on:
      service:
        condition: process_healthy
